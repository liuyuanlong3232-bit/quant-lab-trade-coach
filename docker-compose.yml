services:
  quant-lab:
    build: .
    image: quant-lab-trade-coach:local
    restart: unless-stopped
    env_file: [.env]
    environment:
      QUANT_LAB_DATA_DIR: /var/lib/quant-lab
      QQBOT_APP_ID_FILE: /run/secrets/qqbot_app_id
      QQBOT_APP_SECRET_FILE: /run/secrets/qqbot_app_secret
      QQBOT_OPENID_FILE: /run/secrets/qqbot_openid
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      MIMO_API_KEY_FILE: /run/secrets/mimo_api_key
    secrets:
      - qqbot_app_id
      - qqbot_app_secret
      - qqbot_openid
      - deepseek_api_key
      - mimo_api_key
    ports:
      # Defaults to loopback-only. Override the bind host only through a
      # separately reviewed deployment (for example, a Tailscale host rule).
      - "${QUANT_LAB_BIND_HOST:-127.0.0.1}:${QUANT_LAB_PORT:-8080}:8080"
    volumes:
      - quant_lab_data:/var/lib/quant-lab
      - quant_lab_logs:/var/log/quant-lab
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0755
      - /run/nginx:size=1m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0755
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/trade-coach/summary', timeout=3)\" "]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  quant_lab_data:
  quant_lab_logs:
secrets:
  qqbot_app_id:
    file: ${QQBOT_APP_ID_HOST_FILE:-./.secrets/qqbot_app_id}
  qqbot_app_secret:
    file: ${QQBOT_APP_SECRET_HOST_FILE:-./.secrets/qqbot_app_secret}
  qqbot_openid:
    file: ${QQBOT_OPENID_HOST_FILE:-./.secrets/qqbot_openid}
  deepseek_api_key:
    file: ${DEEPSEEK_API_KEY_HOST_FILE:-./.secrets/deepseek_api_key}
  mimo_api_key:
    file: ${MIMO_API_KEY_HOST_FILE:-./.secrets/mimo_api_key}
