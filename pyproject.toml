[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-lab-trade-coach"
version = "0.1.0"
description = "Local-only personal trade coach with deterministic, fail-closed evidence handling"
requires-python = ">=3.10"
dependencies = ["aiohttp==3.14.3"]

[tool.setuptools.packages.find]
include = ["quant_lab", "quant_lab.*"]
